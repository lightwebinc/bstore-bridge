name: image-publish

# Manual, gated image publish of ghcr.io/lightwebinc/bstore-bridge. No
# automated trigger.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RELEASE to publish image to ghcr.io'
        required: true
      tag:
        description: 'Image tag, a released version without the v (e.g. 0.6.1)'
        required: true
      dry-run:
        description: 'Build only, push nothing'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    if: inputs.confirm == 'RELEASE'
    permissions:
      contents: read
      packages: write
    uses: lightwebinc/ci/.github/workflows/image-publish.yml@5e3a118fc997d254cbc49b9bf14c4fd3ec3974d0 # v0.7.2
    with:
      tag: ${{ inputs.tag }}
      environment: ""
      dry-run: ${{ inputs.dry-run }}
