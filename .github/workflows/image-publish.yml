name: image-publish

# Manual, gated image publish of ghcr.io/lightwebinc/bstore-bridge. No
# automated trigger.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RELEASE to publish image to ghcr.io'
        required: true
      tag:
        description: 'Image tag, a released version without the v (e.g. 0.6.1)'
        required: true
      dry-run:
        description: 'Build only, push nothing'
        type: boolean
        default: false

jobs:
  publish:
    if: inputs.confirm == 'RELEASE'
    permissions:
      contents: read
      packages: write
    uses: lightwebinc/ci/.github/workflows/image-publish.yml@4bd810e61f5ffae2db7054a58d6e519368b40f00 # v0.6.0
    with:
      runs-on: '["self-hosted", "lax"]'
      tag: ${{ inputs.tag }}
      environment: ""
      dry-run: ${{ inputs.dry-run }}
