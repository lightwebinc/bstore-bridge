name: Release

on:
  push:
    tags:
      - 'v*.*'

permissions:
  contents: read

jobs:
  # bstore-bridge is a command an operator installs. Four platforms, each a
  # static binary in a tarball beside the licenses.
  build:
    runs-on: [self-hosted, lax]
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    # bstore's tagged module is served from third_party/goproxy, as in CI.
    env:
      GOPROXY: file://${{ github.workspace }}/third_party/goproxy,https://proxy.golang.org,direct
      GONOPROXY: none
      GONOSUMDB: github.com/lightwebinc/bstore
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -eux
          version="${GITHUB_REF_NAME#v}"
          dir="bstore-bridge_${version}_${GOOS}_${GOARCH}"
          mkdir -p "dist/${dir}"
          go build -trimpath -buildvcs=false \
            -ldflags "-s -w -X main.version=${version}" \
            -o "dist/${dir}/bstore-bridge" ./cmd/bstore-bridge
          # The licenses travel inside the tarball: a statically linked
          # binary contains its dependencies' code, and their licenses
          # require their text to reach whoever receives a binary.
          cp LICENSE NOTICE LICENSE-THIRD-PARTY README.md "dist/${dir}/"
          tar -C dist -czf "dist/${dir}.tar.gz" "${dir}"
          ( cd dist && sha256sum "${dir}.tar.gz" > "${dir}.tar.gz.sha256" )

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bstore-bridge_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: [self-hosted, lax]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          set -eux
          cd dist
          cat *.sha256 | sort -k2 > SHA256SUMS
          rm -f *.tar.gz.sha256
          ls -l
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
