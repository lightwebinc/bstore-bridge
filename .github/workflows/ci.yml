name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
      - name: gofmt
        run: make fmt-check
      - name: vet
        run: make vet
      # The direct dependencies are exactly go-sdk, bcommon and bstore,
      # go.mod is tidy, nothing is replaced, and go-sdk resolves to exactly
      # v1.7.1.
      - name: dependency set
        run: make deps-check
      # LICENSE-THIRD-PARTY matches what the binaries link.
      - name: third-party licences
        run: make licences
      # Unit tests: the bridge backend against the stand-in incumbent on a
      # local test chain, in process; nothing leaves the runner.
      - name: test
        run: make test
